[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-drone-nav"
version = "0.1.0"
description = "Tiny fully-quantized visual navigation model for ESP32-S3 cameras"
requires-python = ">=3.10,<3.12"
dependencies = [
  "tensorflow>=2.16,<2.18",
  "mediapipe>=0.10.14,<0.11",
  "numpy>=1.26,<2.0",
  "Pillow>=10.0,<12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

